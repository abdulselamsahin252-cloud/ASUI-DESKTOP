# ============================================================
# ASUI Desktop – Gradle Yapılandırma Dosyası
# ============================================================
# Bu dosya, projenin derleme ortamını optimize eder.
# Tüm modüllerle uyumludur ve maksimum performans için ayarlanmıştır.
# ============================================================

# ============ JVM AYARLARI (TEK TANIM) ============
# Heap boyutunu artır, G1GC kullan, encoding UTF-8
# -Xmx4096m: 4GB RAM (düşük RAM'li cihazlar için -Xmx2048m)
# -XX:+UseG1GC: Düşük gecikmeli çöp toplayıcı
# -XX:MaxGCPauseMillis=20: Çöp toplama duraklamalarını 20ms altında tut
# -XX:InitiatingHeapOccupancyPercent=35: Erken çöp toplama başlat
# -XX:+DisableExplicitGC: System.gc() çağrılarını engelle
# -XX:MaxMetaspaceSize=512m: Metaspace boyutunu sınırla
# -XX:+HeapDumpOnOutOfMemoryError: OOM hatasında dump al
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+DisableExplicitGC -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ============ GRADLE PERFORMANS ============
# Çoklu projelerde paralel derlemeyi etkinleştir
org.gradle.parallel=true

# Derleme önbelleğini etkinleştir (tekrar derlemeleri hızlandırır)
org.gradle.caching=true

# Yapılandırma önbelleğini etkinleştir (Gradle başlangıç süresini azaltır)
org.gradle.configuration-cache=true

# Gradle Daemon'u arka planda tut (sürekli JVM başlatmayı önler)
org.gradle.daemon=true

# Gereksiz uyarıları gizle (derleme çıktısını temiz tut)
org.gradle.warning.mode=none

# ============ ANDROID ============
# AndroidX kullanımı
android.useAndroidX=true

# 🟢 FIX: Jetifier kaldırıldı (AGP 8.0+ için gereksiz)
# android.enableJetifier=true  ← KALDIRILDI

# R8 full mod (küçültme ve obfuscation için)
android.enableR8.fullMode=true

# 🟢 FIX: Eski resource shrinker kaldırıldı (AGP 8.0+ varsayılan)
# android.experimental.enableNewResourceShrinker=true  ← KALDIRILDI

# Transitive olmayan R sınıfları (derleme hızını artırır)
android.nonTransitiveRClass=false
# Winlator kodu R.id sabitlerine (switch-case) ve baglimlilik R.attr degerlerine ihtiyac duyar
android.nonFinalResIds=false

# Desugaring transform'u etkinleştir (eski API'ler için)
android.enableDexingArtifactTransform.desugaring=true

# ============ AAPT2 (GÜVENLİ YÖNTEM) ============
# 🟢 FIX: Hardcoded path kaldırıldı.
# AAPT2 yolu artık local.properties dosyasından veya ANDROID_HOME'dan alınır.
# Eğer özel bir yol gerekiyorsa local.properties'a ekleyin:
# sdk.dir=/path/to/android-sdk
# android.aapt2FromMavenOverride=...  ← KALDIRILDI

# ============ KOTLIN ============
# Artımlı derleme (sadece değişen dosyaları derler)
kotlin.incremental=true

# Proje içinde paralel task çalıştırma
kotlin.parallel.tasks.in.project=true

# Kotlin önbelleği
kotlin.caching.enabled=true

# Resmi kod stili
kotlin.code.style=official

# JVM hedef sürümü (Java 17)
kotlin.compiler.jvmTarget=17

# ============ TEST ============
# Testlerde detaylı log çıktısı
android.testOptions.unitTests.includeAndroidResources=true

# ============ DERLEME ÖNBELLEĞİ (GELİŞMİŞ) ============
# Gradle'ın daemon önbelleğini ayrı tut
org.gradle.cache.reserved=512m

# Önbellek sıkıştırma
org.gradle.cache.compression.enabled=true

android.aapt2FromMavenOverride=/usr/local/bin/aapt2